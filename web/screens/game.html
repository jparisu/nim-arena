<section id="screen-game" class="screen hidden">
  <div class="game-layout">
    <aside class="panel controls">
      <h3>Setup</h3>
      <label>Rows <span class="muted small">(max 5)</span>
        <input id="cfg-rows" type="number" min="1" max="5" value="3" />
      </label>
      <label>Sticks per row <span class="muted small">(comma-separated, max 10 each)</span>
        <input id="cfg-sticks" type="text" value="3,5,7" />
      </label>

      <div class="seats">
        <div class="seat">
          <h4>Seat 1 <span class="chip chip-a">first</span></h4>
          <select id="seat-0" class="seat-select"></select>
        </div>
        <div class="seat">
          <h4>Seat 2 <span class="chip chip-b">second</span></h4>
          <select id="seat-1" class="seat-select"></select>
        </div>
      </div>

      <label class="inline">AI delay (ms)
        <input id="cfg-delay" type="number" min="0" max="5000" step="100" value="600" />
      </label>

      <div class="toggles">
        <label class="switch"><input type="checkbox" id="toggle-xray" /> X-ray (nim-sum)</label>
        <label class="switch"><input type="checkbox" id="toggle-why" checked /> Why did it move?</label>
      </div>

      <div class="btn-row">
        <button id="btn-new" class="btn primary">New game</button>
        <button id="btn-share" class="btn" title="Copy a replay link">🔗 Share</button>
      </div>
      <div class="btn-row">
        <button id="btn-hint" class="btn" title="Show the optimal move">💡 Hint</button>
        <button id="btn-play-ai" class="btn" title="Advance / autoplay AI turns">⏭ Step</button>
      </div>
    </aside>

    <div class="panel board-wrap">
      <div id="status" class="status">Configure a board and press “New game”.</div>
      <div id="board" class="board"></div>

      <div id="xray" class="xray hidden"></div>

      <div class="timeline">
        <button id="tl-first" class="btn small">⏮</button>
        <button id="tl-prev" class="btn small">◀</button>
        <input id="tl-slider" type="range" min="0" max="0" value="0" />
        <button id="tl-next" class="btn small">▶</button>
        <button id="tl-last" class="btn small">⏭</button>
        <span id="tl-label" class="tl-label">move 0 / 0</span>
      </div>
    </div>

    <aside class="panel why">
      <h3>Move log</h3>
      <div id="why" class="why-body">
        <p class="muted">AI reasoning and per-move timing appear here.</p>
      </div>
    </aside>
  </div>
</section>
