name: Tournament

# Runs the round-robin and commits the updated results/leaderboard.json so the
# Pages scoreboard reflects it. Runs on a weekly schedule and on demand.
#
# Timing is measured HERE, on GitHub's runners (slower and more variable than a
# laptop) — the budget below is deliberately generous. It is a per-player budget
# for a WHOLE GAME, plus the same again for constructing the player. See the docs.
on:
  workflow_dispatch:
    inputs:
      tournament:
        description: "Tournament format"
        type: choice
        options: [simple, league, championship]
        default: league
        required: false
      time_limit:
        description: "Per-player budget in seconds (a whole game, and construction)"
        default: "2.0"
        required: false
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC

permissions:
  contents: write # needed to commit the results file back

concurrency:
  group: tournament
  cancel-in-progress: false

jobs:
  tournament:
    runs-on: ubuntu-latest
    # A run-level ceiling. The per-game budget bounds ONE game (~8.5 s worst
    # case); nothing bounds games x matchups, which grows as O(roster^2). Past
    # about five player kinds the theoretical worst case already exceeds
    # GitHub's 6 h job limit — at which point the job is killed and produces NO
    # leaderboard at all. Failing in 90 minutes is a visible, diagnosable
    # failure instead of a six-hour silent one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the tournament (one forked process per game, hard timeout)
        run: |
          nim-tournament \
            --out results/leaderboard.json \
            --tournament "${{ github.event.inputs.tournament || 'league' }}" \
            --time-limit "${{ github.event.inputs.time_limit || '2.0' }}"

      - name: Commit updated leaderboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- results/leaderboard.json; then
            echo "Leaderboard unchanged; nothing to commit."
          else
            git add results/leaderboard.json
            # No CI-skip marker here (it suppresses every workflow on the push).
            # Note that removing it is not what redeploys the scoreboard: this
            # push uses the default GITHUB_TOKEN, and GitHub raises no `push`
            # event for such commits, so no workflow can trigger from it at all.
            # Pages instead reacts to *this workflow completing*, via its
            # `workflow_run` trigger. See .github/workflows/pages.yml.
            git commit -m "chore(tournament): update leaderboard"
            git push
          fi
