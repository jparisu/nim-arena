name: Pages

# Assembles the static web app (bundles the shared Python into py.zip and copies
# the latest leaderboard) and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "players/**"
      - "players.yaml"
      - "results/leaderboard.json"
      - "scripts/build_web.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble web assets
        run: python scripts/build_web.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
