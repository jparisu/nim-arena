# NIM Arena — player manifest.
#
# This is the single, human-edited list of players admitted to the tournament
# and the web page. Discovery happens ONLY through this file — nothing
# auto-scans the players/ folder.
# When someone opens a PR to add a bot, the reviewer sees, in one diff, both the new
# file and the single line that admits it. The review IS the security gate.
#
# The manifest is an *admission list*: which file, and which class in it. A
# player's name, authors and description are declared by the class itself
# (get_name / get_authors / get_description), so there is exactly one source of
# truth and nothing here to drift out of step with the code.
#
# To add a player (see CONTRIBUTING.md and the docs' "submit a player" guide):
#   1. Add players/<your_bot>.py with a subclass of nimarena.player.Player.
#   2. Implement get_name / get_authors / get_description, and choose_move.
#   3. Add ONE entry below.
#
# Each entry has:
#   file    path to the .py file. A bare filename is resolved inside players/;
#           a path with '/' is resolved from the repo root.
#   class   the Player subclass to admit.

players:
  # The four reference players, in increasing order of strength. Each is a thin
  # wrapper that names a strategy from nimarena.bots and picks its settings.
  - file: random.py
    class: Random

  - file: easy.py
    class: Easy

  - file: medium.py
    class: Medium

  - file: hard.py
    class: Hard
